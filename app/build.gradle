plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dez.desktop'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dez.desktop'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs out of the box;
            // replace with a real signing config before publishing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}
